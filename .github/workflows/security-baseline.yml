name: Security Pipeline 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan original application
        run: |
          cd sps-ca1-flask-expenses
          set +e
          bandit -r app.py seed.py -f json -o ../bandit-results.json
          json_status=$?
          bandit -r app.py seed.py -f txt -o ../bandit-results.txt
          text_status=$?
          if [ "$json_status" -ne 0 ] || [ "$text_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-reports
          path: |
            bandit-results.json
            bandit-results.txt
          if-no-files-found: warn

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan original application
        run: |
          cd sps-ca1-flask-expenses
          semgrep scan --config p/python --config p/flask --error --json --output ../semgrep-results.json .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep-results.json
          if-no-files-found: warn

  dependency-audit:
    name: pip-audit SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Scan dependencies
        run: |
          cd sps-ca1-flask-expenses
          pip-audit -r requirements.txt --format json --output ../pip-audit-results.json

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-results.json
          if-no-files-found: warn

  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  ruff:
    name: Ruff Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Scan original application
        run: |
          cd sps-ca1-flask-expenses
          ruff check app.py seed.py --output-format json --output-file ../ruff-results.json

      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruff-report
          path: ruff-results.json
          if-no-files-found: warn

  custom-tests:
    name: Custom Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies and pytest
        run: |
          cd sps-ca1-flask-expenses
          python -m pip install -r requirements.txt pytest

      - name: Run horizontal access-control tests
        working-directory: sps-ca1-flask-expenses
        run: |
          python -m pytest tests/ -v --junitxml=../custom-test-results.xml

      - name: Upload custom test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: custom-security-test-results
          path: custom-test-results.xml
          if-no-files-found: warn

  zap:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          cd sps-ca1-flask-expenses
          python -m pip install -r requirements.txt

      - name: Start Flask application
        run: |
          cd sps-ca1-flask-expenses
          python -m flask --app app run --host 0.0.0.0 --port 5000 > flask.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/login >/dev/null; then
              echo "Flask application is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Flask application failed to start."
          cat flask.log
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report